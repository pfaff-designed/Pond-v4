name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run as parallel jobs, not one sequential job: the critical path drops from about 4m45s
  # (lint, typecheck, jest, pglite and build in a row) to the slowest single job. `ci-passed` is the
  # one stable name branch protection requires, so adding or splitting a job never touches protection.
  lint-typecheck:
    name: Lint · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  jest:
    name: Test (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (jest)
        run: npm test

      # CI's runner is UTC, which has no DST transitions, so the trash DST regression tables
      # (purgeDay in change-log-deleted-view.test.ts, the "in 30 days" case in
      # change-log-trash-view.test.ts) pass here even if purgeDay reverted to ms math. KAN-500.
      - name: Test (jest, a DST time zone)
        run: TZ=America/New_York npx jest src/__tests__/change-log-deleted-view.test.ts src/__tests__/change-log-trash-view.test.ts src/__tests__/trash-path.test.tsx

  pglite:
    name: Test (PGLite schema invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The slowest check (about 2-4 minutes), so a PR runs only the PGLite tests related to what it
      # changed. A change to the migrations or the harness (which loads them from disk, so jest's import
      # graph can't see the link) runs them all, and so does every push to main.
      - name: Test (PGLite schema invariants)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then npm run test:pglite; exit; fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(supabase/|src/__tests__/helpers/pglite|jest\.config\.pglite|package(-lock)?\.json$)'; then
            npm run test:pglite
          else
            mapfile -t files < <(printf '%s\n' "$changed" | grep -E '\.(ts|tsx)$' | while read -r f; do [ -f "$f" ] && echo "$f"; done)
            if [ "${#files[@]}" -eq 0 ]; then echo "No TypeScript changes: no PGLite tests to run."; exit 0; fi
            NODE_OPTIONS=--experimental-vm-modules npx jest --config jest.config.pglite.mjs --passWithNoTests --findRelatedTests "${files[@]}"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder values so `next build` can inline NEXT_PUBLIC_* vars.
          # For real values, add repo Secrets and reference them here, e.g.
          #   NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  storybook:
    name: Storybook tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: npm run test-storybook

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint-typecheck, jest, pglite, build, storybook]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required check did not pass: ${{ toJSON(needs) }}"
            exit 1
          fi
