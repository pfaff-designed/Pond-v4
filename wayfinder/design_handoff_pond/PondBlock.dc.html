<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/mn/tokens/fonts.css">
</helmet>
<div style="{{ block }}">
<sc-if value="{{ hasHandle }}"><span style="{{ handleBox }}"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="3" r="1.1"></circle><circle cx="7" cy="3" r="1.1"></circle><circle cx="3" cy="7" r="1.1"></circle><circle cx="7" cy="7" r="1.1"></circle><circle cx="3" cy="11" r="1.1"></circle><circle cx="7" cy="11" r="1.1"></circle></svg></span></sc-if>
<sc-if value="{{ hasDrop }}"><span style="{{ dropBar }}"></span></sc-if>
<sc-if value="{{ hasHead }}"><div style="{{ head }}"><span style="{{ eyebrow }}">{{ heading }}</span><span style="{{ headMeta }}">{{ headNote }}</span></div></sc-if>
<sc-if value="{{ isFile }}"><div style="{{ fileRow }}"><span style="{{ fileTag }}">{{ fileExt }}</span><span style="{{ fileText }}"><span style="{{ fileName }}">{{ fileNameText }}</span><span style="{{ fileMeta }}">{{ fileMetaText }}</span></span><div style="{{ fileActs }}"><sc-for list="{{ fileButtons }}" as="fb" hint-placeholder-count="1"><dc-import name="PondControl" kind="button" variant="{{ fb.v }}" label="{{ fb.l }}" theme="{{ theme }}" size="{{ size }}" hint-size="auto,32px"></dc-import></sc-for></div></div><sc-if value="{{ hasProgress }}"><div style="{{ track }}"><span style="{{ bar }}"></span></div></sc-if></sc-if>
<sc-if value="{{ isEmpty }}"><div style="{{ emptyBox }}"><span style="{{ emptyText }}">{{ emptyLine }}</span><dc-import name="PondControl" kind="button" variant="secondary" label="{{ emptyAction }}" theme="{{ theme }}" size="{{ size }}" hint-size="auto,32px"></dc-import></div></sc-if>
<sc-if value="{{ isLoading }}"><div style="{{ stack }}"><sc-for list="{{ skel }}" as="w" hint-placeholder-count="3"><span style="{{ w.style }}"></span></sc-for></div></sc-if>
<sc-if value="{{ showRows }}"><div style="{{ stack }}"><sc-if value="{{ isTable }}"><div style="{{ thead }}"><span style="{{ th }}">{{ col0 }}</span><span style="{{ th }}">{{ col1 }}</span><span style="{{ th }}">{{ col2 }}</span><span style="{{ thR }}">{{ col3 }}</span></div></sc-if><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><dc-import name="PondMolecule" kind="{{ r.kind }}" title="{{ r.title }}" meta="{{ r.meta }}" value="{{ r.value }}" qty="{{ r.qty }}" label="{{ r.label }}" value-kind="{{ r.vk }}" tag="{{ r.tag }}" on="{{ r.on }}" fill="{{ fill }}" state="{{ r.state }}" theme="{{ theme }}" size="{{ size }}" hint-size="{{ r.hint }}"></dc-import></sc-for></div></sc-if>
<sc-if value="{{ isGallery }}"><div style="{{ gallery }}"><sc-for list="{{ cards }}" as="c" hint-placeholder-count="3"><dc-import name="PondMolecule" kind="record-card" title="{{ c.title }}" meta="{{ c.meta }}" tag="{{ c.tag }}" state="{{ c.state }}" theme="{{ theme }}" size="{{ size }}" hint-size="170px,190px"></dc-import></sc-for></div></sc-if>
<sc-if value="{{ isNumber }}"><div style="{{ bigWrap }}"><span style="{{ big }}">{{ bigValue }}</span><span style="{{ bigSub }}">{{ bigNote }}</span></div></sc-if>
<sc-if value="{{ isTomb }}"><div style="{{ tomb }}"><span style="{{ tombText }}">{{ tombLine }}</span><div style="{{ tombActions }}"><dc-import name="PondControl" kind="button" variant="secondary" label="restore" theme="{{ theme }}" size="{{ size }}" hint-size="auto,32px"></dc-import><dc-import name="PondControl" kind="button" variant="ghost" label="remove block" theme="{{ theme }}" size="{{ size }}" hint-size="auto,32px"></dc-import></div></div></sc-if>
<sc-if value="{{ isError }}"><dc-import name="PondMolecule" kind="notice" title="{{ errLine }}" action="reconnect" theme="{{ theme }}" size="{{ size }}" hint-size="440px,50px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:320},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;checklist&quot;,&quot;table&quot;,&quot;gallery&quot;,&quot;number&quot;,&quot;log&quot;,&quot;properties&quot;,&quot;file&quot;],&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rest&quot;,&quot;hover&quot;,&quot;selected&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;error&quot;,&quot;deleted&quot;,&quot;disabled&quot;,&quot;lifted&quot;,&quot;origin&quot;],&quot;default&quot;:&quot;rest&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper'|'ink'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cols&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;[string,string,string,string,string?][]&quot;},&quot;fill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;side by side&quot;},&quot;handle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;open&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;''|'hover'|'open'&quot;,&quot;section&quot;:&quot;side by side&quot;},&quot;drop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;left&quot;,&quot;right&quot;,&quot;above&quot;,&quot;below&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;side by side&quot;},&quot;dropSpan&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;side by side&quot;},&quot;upload&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;done&quot;,&quot;uploading&quot;,&quot;failed&quot;,&quot;large&quot;,&quot;type&quot;],&quot;default&quot;:&quot;done&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;file&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:62,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;file&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const kind = p.kind ?? 'list', state = p.state ?? 'rest';
    const theme = p.theme ?? 'paper', size = p.size ?? 'desktop';
    const ink = theme === 'ink', mob = size === 'mobile';
    const fg = ink ? '#FAF9EF' : '#1B1D14', base = ink ? '250,249,239' : '27,29,20';
    const a = x => `rgba(${base},${x})`;
    const card = ink ? '#30312A' : '#FAF9EF';
    const cardShadow = ink ? '0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.34)' : '0 1px 2px rgba(40,34,24,.04),0 8px 24px rgba(40,34,24,.06)';
    const sans = "'PP Neue Montreal',system-ui,sans-serif", mono = "'PP Neue Montreal Mono',monospace";
    const pj = v => { if (!v) return null; try { return typeof v === 'string' ? JSON.parse(v) : v; } catch (e) { return null; } };
    const pRows = pj(p.rows), pCols = pj(p.cols) || ['date', 'recipe', 'servings', 'kcal'];
    const S = x => state === x;
    const tombed = state === 'deleted';
    const sel = S('selected'), hover = S('hover'), empty = S('empty'), load = S('loading'), err = S('error');
    const W = tombed ? 460 : ({ list: 400, checklist: 400, table: 500, gallery: 580, number: 400, log: 460, properties: 400, file: 460 }[kind] || 400);
    const fillOn = p.fill === true || p.fill === 'true';
    const width = fillOn ? '100%' : mob ? 360 : W;
    const lifted = S('lifted'), origin = S('origin');
    const hd = p.handle ?? '', dr = p.drop ?? '';
    const block = { position: 'relative', display: 'flex', flexDirection: 'column', gap: 12, boxSizing: 'border-box', width, padding: mob ? '16px 14px' : '16px 18px', borderRadius: 20, fontFamily: sans, color: fg, background: tombed ? 'transparent' : card, boxShadow: tombed ? `inset 0 0 0 1.4px ${a(.2)}` : sel ? `0 0 0 2px ${fg},${cardShadow}` : lifted ? (ink ? '0 2px 4px rgba(0,0,0,.34),0 20px 44px rgba(0,0,0,.5)' : '0 2px 4px rgba(40,34,24,.06),0 20px 44px rgba(40,34,24,.16)') : cardShadow, ...(lifted ? { transform: 'rotate(-.6deg)' } : {}), ...(S('disabled') || origin ? { opacity: .4 } : {}) };
    const H0 = { list: ['notifications', '3'], checklist: ['method', '1 of 3'], table: ['calories', p.meta ?? 'rows only'], gallery: ['recipes', '18 records'], number: ['kcal this week', ''], log: ['entry log', 'cooked 3 times'], properties: ['record', 'recipes'], }[kind] || ['', ''];
    const H = tombed ? [H0[0], 'database deleted'] : H0;
    const sk = (w, h = 10) => ({ style: { display: 'block', height: h, width: w, borderRadius: 5, background: a(.08) } });
    const R = {
      list: [['list-row', 'cabinet quote', 'today'], ['list-row', 'renew insurance', '28 sep'], ['list-row', 'standup', '30 sep']].map(([k, t, m], i) => ({ kind: k, title: t, meta: m, state: hover && i === 1 ? 'hover' : 'rest', hint: '360px,36px' })),
      checklist: [['soak overnight', 'true'], ['simmer 25 min with bay', 'false'], ['stir through harissa', 'false']].map(([t, o], i) => ({ kind: 'check-row', title: t, on: i === 0 ? 'true' : o, state: hover && i === 1 ? 'hover' : 'rest', hint: '360px,36px' })),
      table: (pRows || [['19 sep', 'chickpeas, harissa', '2', '1,040', 'rest'], ['17 sep', 'cacio e pepe', '1', '710', 'error'], ['14 sep', 'chickpeas, harissa', '1', '520', 'rest']]).map(([m, t, q, v, st], i) => ({ kind: 'table-row', meta: m, title: t, qty: q, value: v, state: hover && i === 0 ? 'hover' : st, hint: '460px,38px' })),
      log: [['19 sep', 'Cooked for four. Needs more salt than you think.'], ['14 sep', 'Half batch. Breadcrumbs next time.'], ['2 sep', 'First go, from the Ottolenghi book.']].map(([m, t], i) => ({ kind: 'entry', meta: m, title: t, state: hover && i === 0 ? 'hover' : 'rest', hint: '420px,50px' })),
      properties: [['kcal per serving', '520', 'number'], ['time', '25m', 'duration'], ['cooked', '19 sep', 'date'], ['source', 'Ottolenghi, Simple', 'text']].map(([l, v, k], i) => ({ kind: 'field-row', label: l, value: v, vk: k, state: hover && i === 0 ? 'hover' : 'rest', hint: '360px,34px' }))
    }[kind] || [];
    const skel = kind === 'number' ? [sk('60%', 52), sk('40%')] : kind === 'gallery' ? [sk('100%', 120), sk('50%')] : [sk('82%'), sk('64%'), sk('74%')];
    const EL = { list: ['nothing due', 'add an item'], checklist: ['no steps yet', 'add a step'], table: ['no rows yet', 'add a row'], gallery: ['no recipes yet', 'add a record'], number: ['no values this week', 'pick a field'], log: ['no entries yet', 'write one'], properties: ['no fields yet', 'add a field'] }[kind] || ['', ''];
    const special = tombed || ['gallery', 'number', 'file'].includes(kind);
    const isFile = kind === 'file' && !tombed, up = p.upload ?? 'done', pct = Math.max(0, Math.min(100, Number(p.progress ?? 62)));
    const fname = p.value || 'renovation brief, july.pdf', ext = (p.meta && kind === 'file' && up === 'type') ? p.meta : (fname.split('.').pop() || 'file');
    const FM = { done: '4 pages · added 10:26', uploading: `uploading · ${pct}% of 4.2 mb`, failed: 'upload failed · the connection dropped', large: '148 mb · files can be up to 100 mb', type: `pond can’t keep .${ext} files` };
    const FB = { done: [['open', 'secondary']], uploading: [['cancel', 'ghost']], failed: [['retry', 'secondary'], ['remove', 'ghost']], large: [['remove', 'ghost']], type: [['remove', 'ghost']] };
    return {
      col0: pCols[0], col1: pCols[1], col2: pCols[2], col3: pCols[3],
      theme, size, block, fill: fillOn, hasHead: !isFile,
      isFile, fileExt: ext, fileNameText: fname, fileMetaText: (kind === 'file' && p.meta && up !== 'type') ? p.meta : FM[up] || FM.done,
      fileRow: { display: 'flex', alignItems: 'center', gap: 12 },
      fileTag: { flex: 'none', minWidth: 34, height: mob ? 34 : 30, padding: '0 6px', boxSizing: 'border-box', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', background: a(.07), fontFamily: mono, fontSize: 10.5, color: up === 'done' ? a(.8) : a(.68), textTransform: 'lowercase' },
      fileText: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 2 },
      fileName: { fontSize: mob ? 15 : 13.5, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: up === 'large' || up === 'type' ? a(.68) : fg, textDecoration: up === 'large' || up === 'type' ? 'line-through' : 'none', textDecorationColor: a(.4) },
      fileMeta: { fontFamily: mono, fontSize: mob ? 12 : 10.5, color: up === 'done' || up === 'uploading' ? a(.68) : a(.8), whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
      fileActs: { flex: 'none', display: 'flex', gap: 6 }, fileButtons: (FB[up] || FB.done).map(([l, v]) => ({ l, v })),
      hasProgress: isFile && up === 'uploading', track: { height: 2, borderRadius: 1, background: a(.09), overflow: 'hidden', margin: '0 2px' }, bar: { display: 'block', height: 2, width: pct + '%', borderRadius: 1, background: fg, transition: 'width 280ms cubic-bezier(.22,.8,.2,1)' },
      hasHandle: !!hd, handleBox: mob ? { position: 'absolute', right: 2, top: 2, width: 44, height: 44, display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: 14, color: hd === 'open' ? fg : a(.68), background: hd === 'open' ? a(.07) : 'transparent' } : { position: 'absolute', left: -14, top: 12, width: 12, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: 6, color: hd === 'open' ? fg : a(.68), background: hd === 'open' ? a(.07) : 'transparent' },
      hasDrop: !!dr, dropBar: { position: 'absolute', borderRadius: 1, background: fg, ...(dr === 'left' ? { left: -9, top: 0, bottom: 0, width: 2 } : dr === 'right' ? { right: -9, top: 0, bottom: 0, width: 2 } : dr === 'above' ? { top: -9, left: 0, height: 2, ...(p.dropSpan ? { width: p.dropSpan } : { right: 0 }) } : { bottom: -9, left: 0, height: 2, ...(p.dropSpan ? { width: p.dropSpan } : { right: 0 }) }) }, heading: p.heading ?? H[0], headNote: load ? 'loading…' : H[1],
      head: { display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 12, ...(mob && hd ? { paddingRight: 40, minHeight: 28 } : {}) },
      eyebrow: { fontSize: 10.5, fontWeight: 500, letterSpacing: '.1em', textTransform: 'uppercase', color: a(.68) },
      headMeta: { fontFamily: mono, fontSize: 10.5, color: a(.68) },
      isEmpty: empty, emptyLine: EL[0], emptyAction: EL[1],
      emptyBox: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, padding: '14px 14px', borderRadius: 14, background: a(.035) },
      emptyText: { fontSize: mob ? 15 : 13.5, color: a(.68) },
      isLoading: load, skel, stack: { display: 'flex', flexDirection: 'column', gap: kind === 'table' ? 0 : 2 },
      showRows: !empty && !load && !err && !special, rows: R, isTable: kind === 'table',
      thead: { display: 'grid', gridTemplateColumns: mob ? '54px minmax(0,1fr) 44px 58px' : '62px minmax(0,1fr) 64px 80px', columnGap: 14, padding: '0 8px 8px', borderBottom: `1px solid ${a(.09)}` },
      th: { fontSize: 10.5, fontWeight: 500, letterSpacing: '.1em', textTransform: 'uppercase', color: a(.68) }, thR: { fontSize: 10.5, fontWeight: 500, letterSpacing: '.1em', textTransform: 'uppercase', color: a(.68), textAlign: 'right' },
      isGallery: kind === 'gallery' && !empty && !load && !err && !tombed, gallery: { display: 'flex', gap: 12, flexWrap: 'wrap' },
      cards: [['chickpeas, harissa, yoghurt', '25m'], ['cacio e pepe', '15m'], ['sourdough, 78%', '18h']].slice(0, mob ? 2 : 3).map(([t, m], i) => ({ title: t, meta: m, tag: 'recipe', state: hover && i === 0 ? 'hover' : sel && i === 1 ? 'selected' : 'rest' })),
      isNumber: kind === 'number' && !empty && !load && !err && !tombed, bigWrap: { display: 'flex', flexDirection: 'column', gap: 6 },
      big: { fontSize: mob ? 56 : 76, fontWeight: 700, letterSpacing: '-.03em', lineHeight: .9, fontVariantNumeric: 'tabular-nums' }, bigValue: p.value ?? '11,240', bigNote: p.meta ?? 'kcal · 6 of 7 days logged', bigSub: { fontFamily: mono, fontSize: 11, color: a(.68) },
      isTomb: tombed, tomb: { display: 'flex', flexDirection: 'column', gap: 12 }, tombLine: `This view showed ${H0[0]}, which was deleted on 22 sep. It can be restored for 30 days.`, tombText: { fontFamily: mono, fontSize: mob ? 12 : 11, lineHeight: 1.55, color: a(.8) }, tombActions: { display: 'flex', gap: 8 },
      isError: err, errLine: kind === 'table' || kind === 'gallery' || kind === 'number' ? 'pond can’t reach this sheet any more · showing the last copy' : 'this block couldn’t load'
    };
  }
}
</script>
</body>
</html>
