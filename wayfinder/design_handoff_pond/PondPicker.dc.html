<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/mn/tokens/fonts.css">
<script src="_ds/mn/assets/icons/icon-mask.js"></script>
</helmet>
<div style="{{ glass }}">
<sc-if value="{{ hasHead }}"><div style="{{ head }}"><sc-if value="{{ headGlyph }}"><span data-icon="waves-02" style="{{ glyph }}"></span></sc-if><sc-if value="{{ hasScope }}"><span style="{{ scope }}">{{ scopeText }}</span></sc-if><span style="{{ headText }}">{{ query }}</span><sc-if value="{{ caretOn }}"><span style="{{ caret }}"></span></sc-if><div style="flex:1"></div><span style="{{ headKey }}">{{ headRight }}</span></div></sc-if>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<sc-if value="{{ r.isGroup }}"><div style="{{ r.groupStyle }}">{{ r.label }}</div></sc-if>
<sc-if value="{{ r.isNote }}"><div style="{{ note }}">{{ r.label }}</div></sc-if>
<sc-if value="{{ r.isItem }}"><div style="{{ r.style }}"><sc-if value="{{ r.hasSvg }}"><span style="{{ iconWrap }}"><svg width="13" height="13" viewBox="0 0 14 14" fill="{{ r.fill }}" stroke="{{ r.stroke }}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ r.d }}"></path></svg></span></sc-if><sc-if value="{{ r.hasGlyph }}"><span data-icon="{{ r.glyph }}" style="{{ glyph }}"></span></sc-if><sc-if value="{{ r.isAction }}"><span style="{{ actMark }}">&gt;</span></sc-if><span style="{{ r.labelStyle }}"><span>{{ r.pre }}</span><span style="{{ match }}">{{ r.hit }}</span><span>{{ r.post }}</span></span><sc-if value="{{ r.hasSub }}"><span style="{{ r.subStyle }}">{{ r.sub }}</span></sc-if><div style="flex:1"></div><sc-if value="{{ r.hasHint }}"><span style="{{ hint }}">{{ r.hint }}</span></sc-if><sc-if value="{{ r.sel }}"><span style="{{ enter }}">↵</span></sc-if></div></sc-if>
<sc-if value="{{ r.isSeg }}"><div style="{{ seg }}"><sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="2"><span style="{{ o.style }}">{{ o.label }}</span></sc-for></div></sc-if>
</sc-for>
<sc-if value="{{ hasFoot }}"><div style="{{ footStyle }}"><sc-for list="{{ footItems }}" as="f" hint-placeholder-count="3"><span>{{ f }}</span></sc-for></div></sc-if>
</div>
</x-dc>

      if (state === 'open') { rows = all; rows[1].sel = true; if (mob) rows = rows.slice(0, 12); foot = ['↑↓ move', '↵ insert', 'esc keep as text']; }
      else if (state === 'filtered') { rows = [it('table', { icon: 'table', hit: 'ta', sel: true }), it('entry log', { icon: 'log', hint: 'dated table' }), it('page from template', { icon: 'tpl', hit: 'ta', at: 13 })]; foot = ['/ ta — 3 matches']; }

      if (state === 'source') { head = { text: '/table', right: '' }; rows = [G('new'), it('new database — recipes', { icon: 'plus', sel: true }), G('or view an existing one'), it('recipes', { icon: 'db', hint: '18 records' }), it('calories', { icon: 'db', hint: '412 rows' }), it('transactions', { icon: 'db', hint: '1,380 rows' }), it('subscriptions', { icon: 'db', hint: '6 records' }), it('sleep nights', { icon: 'db', hint: '241 rows' })]; foot = ['named after this page', '↵ create']; }
