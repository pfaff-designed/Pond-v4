      foot: { display: 'flex', flexDirection: 'column', gap: 2, padding: '10px 8px 0', margin: '0 0', borderTop: `1px solid ${a(.09)}` },
      dbRow: { display: 'flex', alignItems: 'center', gap: 9, padding: mob ? '12px 8px' : '6px 8px', fontSize: mob ? 15 : 13.5, fontWeight: 500, borderRadius: 10 },
      newRow: { padding: mob ? '12px 8px' : '6px 8px', fontSize: mob ? 14 : 12.5, color: a(.68) },
      edge: { position: 'absolute', top: 16, bottom: 16, right: 0, width: 2, borderRadius: 2, background: fg },
      edgeTag: { position: 'absolute', right: 8, bottom: 70, fontFamily: mono, fontSize: 10.5, padding: '2px 6px', borderRadius: 6, background: a(.07), color: a(.8) }
    };
  }
}
