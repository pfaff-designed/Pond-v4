<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/mn/tokens/fonts.css">
</helmet>
<div style="{{ page }}">
<div style="{{ head }}"><span style="{{ title }}">{{ titleText }}</span><span style="{{ meta }}">{{ metaText }}</span></div>
<sc-for list="{{ blocks }}" as="b" hint-placeholder-count="3">
<div style="{{ b.card }}">
<sc-if value="{{ b.hasEyebrow }}"><div style="{{ bhead }}"><span style="{{ eyebrow }}">{{ b.label }}</span><span style="{{ note }}">{{ b.note }}</span></div></sc-if>
<sc-if value="{{ b.isText }}"><p style="{{ b.textStyle }}">{{ b.text }}</p></sc-if>
<sc-if value="{{ b.isRows }}"><div style="{{ stack }}"><sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="3"><div style="{{ row }}"><sc-if value="{{ r.hasBox }}"><span style="{{ r.box }}"><sc-if value="{{ r.done }}"><svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 4.8 3.7 6.6 7.2 2.4"></path></svg></sc-if></span></sc-if><sc-if value="{{ r.hasDot }}"><span style="{{ dot }}"></span></sc-if><span style="{{ r.aStyle }}">{{ r.a }}</span><span style="{{ r.bStyle }}">{{ r.b }}</span></div></sc-for></div></sc-if>
<sc-if value="{{ b.isTable }}"><div style="{{ stack0 }}"><div style="{{ b.grid }}"><sc-for list="{{ b.cols }}" as="c" hint-placeholder-count="3"><span style="{{ th }}">{{ c }}</span></sc-for></div><sc-for list="{{ b.trows }}" as="r" hint-placeholder-count="3"><div style="{{ b.gridRow }}"><sc-for list="{{ r }}" as="c" hint-placeholder-count="3"><span style="{{ c.style }}">{{ c.v }}</span></sc-for></div></sc-for></div></sc-if>
<sc-if value="{{ b.isGallery }}"><div style="{{ gallery }}"><sc-for list="{{ b.cards }}" as="c" hint-placeholder-count="3"><div style="{{ gcard }}"><span style="{{ c.img }}"></span><span style="{{ c.tStyle }}">{{ c.t }}</span><span style="{{ c.mStyle }}">{{ c.m }}</span></div></sc-for></div></sc-if>
<sc-if value="{{ b.isNumber }}"><div style="{{ numWrap }}"><span style="{{ b.bigStyle }}">{{ b.big }}</span><span style="{{ sub }}">{{ b.sub }}</span></div></sc-if>
<sc-if value="{{ b.isBars }}"><div style="{{ bars }}"><sc-for list="{{ b.bars }}" as="h" hint-placeholder-count="12"><span style="{{ h }}"></span></sc-for></div></sc-if>
<sc-if value="{{ b.isHeat }}"><div style="{{ heat }}"><sc-for list="{{ b.cells }}" as="h" hint-placeholder-count="28"><span style="{{ h }}"></span></sc-for></div></sc-if>
<sc-if value="{{ b.isVoid }}"><div style="{{ voidBox }}">{{ b.voidText }}</div></sc-if>
<sc-if value="{{ b.isEntries }}"><div style="{{ stack }}"><sc-for list="{{ b.entries }}" as="e" hint-placeholder-count="3"><div style="{{ entry }}"><span style="{{ edate }}">{{ e.d }}</span><span style="{{ e.style }}">{{ e.t }}</span></div></sc-for></div></sc-if>
<sc-if value="{{ b.isKanban }}"><div style="{{ kanban }}"><sc-for list="{{ b.lanes }}" as="l" hint-placeholder-count="3"><div style="{{ lane }}"><div style="{{ laneHead }}"><span>{{ l.name }}</span><span style="{{ laneN }}">{{ l.n }}</span></div><sc-for list="{{ l.cards }}" as="c" hint-placeholder-count="2"><dc-import name="PondMolecule" kind="task-card" title="{{ c.t }}" meta="{{ c.m }}" value="{{ c.s }}" on="{{ c.on }}" state="{{ c.state }}" width="{{ c.w }}" theme="{{ c.theme }}" size="desktop" hint-size="100%,52px"></dc-import></sc-for></div></sc-for></div></sc-if>
<sc-if value="{{ b.isGantt }}"><div style="{{ stack0 }}"><div style="{{ gHead }}"><span></span><div style="{{ gTicks }}"><sc-for list="{{ b.ticks }}" as="k" hint-placeholder-count="4"><span style="{{ gTick }}">{{ k }}</span></sc-for></div></div><sc-for list="{{ b.tasks }}" as="g" hint-placeholder-count="4"><div style="{{ gRow }}"><span style="{{ g.lStyle }}">{{ g.t }}</span><div style="{{ gTrack }}"><span style="{{ g.bar }}"></span></div></div></sc-for></div></sc-if>
<sc-if value="{{ b.isHighlight }}"><div style="{{ b.hlStyle }}">{{ b.text }}</div></sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:720},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;page&quot;,&quot;notes&quot;,&quot;list&quot;,&quot;project&quot;,&quot;tracker&quot;,&quot;journal&quot;,&quot;collection&quot;,&quot;database&quot;,&quot;dashboard&quot;,&quot;meeting&quot;,&quot;reading&quot;,&quot;habit&quot;],&quot;default&quot;:&quot;project&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;filled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper'|'ink'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;}}">
